name: Build Ergohaven

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:

jobs:

  build-ergohaven:
    name: Build Ergohaven keymaps
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { kb: ergohaven/macropad/rev3, km: v3 }
          - { kb: ergohaven/macropad/rev3, km: codex }
          - { kb: ergohaven/macropad/rev3, km: codex_entropy }

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v3
      with:
        persist-credentials: false
        submodules: recursive

    - name: Prepare variables
      shell: bash
      env:
          kb: ${{ matrix.kb }}
          km: ${{ matrix.km }}
      run: |
          set -x
          OUTPUT="${kb//\//_}_${km}"
          echo "OUTPUT=${OUTPUT}" >> $GITHUB_ENV

    - name: Build
      id: build
      shell: bash
      run: |
        git config --global --add safe.directory $(pwd)
        set -o pipefail
        if ! qmk compile -kb ${{ matrix.kb }} -km ${{ matrix.km }} 2>&1 | tee build.log; then
          python3 util/codex_ci_summary.py build.log
          exit 1
        fi

    - name: Protocol tests
      if: always() && matrix.km == 'codex'
      shell: bash
      run: |
        set -o pipefail
        if ! (gcc -std=c11 -Wall -Wextra -Werror -g -fsanitize=address,undefined keyboards/ergohaven/macropad/codex/protocol.c keyboards/ergohaven/macropad/codex/test_protocol.c -lm -o /tmp/codex-test && /tmp/codex-test) 2>&1 | tee test.log; then
          python3 util/codex_ci_summary.py test.log
          exit 1
        fi

    - name: Firmware checksums
      shell: bash
      run: sha256sum "${OUTPUT}.uf2" > "${OUTPUT}.sha256"

    - name: Verify hybrid USB descriptors
      if: matrix.km == 'codex_entropy'
      shell: bash
      run: python3 util/check_codex_hybrid_uf2.py "${OUTPUT}.uf2"

    - uses: actions/upload-artifact@v4
      name: Upload
      id: upload
      with:
        path: |
          *.uf2
          *.sha256
        name: ${{ env.OUTPUT }}

  merge:
    runs-on: ubuntu-latest
    needs: build-ergohaven
    name: Merge Output Artifacts
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: ergohaven_fw
          pattern: ergohaven_*
          delete-merged: true
